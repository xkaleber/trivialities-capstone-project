services:
  - type: web
    name: trivialities-trivia-app
    runtime: node
    plan: free 
    region: oregon 
    # Forces Render to include typescript and types during compilation phase
    buildCommand: npm install --production=false --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false 
      - key: NEXTAUTH_SECRET
        sync: false 
      - key: NEXTAUTH_URL
        value: https://onrender.com

